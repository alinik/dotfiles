line-length = 120
target-version = "py311"
[lint]
select = ["ALL"]
#select = ["E",   "F", "UP", "B", "SIM", "I", "Q","FIX","ARG",
#    "COM","PLR","N", "FBT", "TRY", "PYI", "C4",
#    ,"ANN"
#]

ignore = [
    "RUF100", # Unused ruff configuration file
    "ANN", # annotations
    "FBT002",
    "FBT003", # Boolean positional value in function calls (internal use)
    "ARG001", # unused-argument
    "ARG002", # Unused method argument
    "G004", # Logging statement uses f-string
    "D", # "D100",  # missing-docstring
    "DOC", # docstrings
    "CPY001",
    "COM812", # missing-trailing-comma
    "TRY400", # Use `logging.exception` instead of `logging.error`
    "PLR0913", # too-many-arguments
    "PLR0917", # too-many-positional-arguments
    "EM101", # Exception must not use a string literal, assign to variable first
    "TD003", # missing-todo-link
    "PLC0414", # useless-import-alias
    "TRY003", # raise-vanilla-args
    "DTZ", # datetime-timezone
    "TRY300", # try-consider-else
    "N814", # camelcase-imported-as-constant
    "FBT001", # boolean-type-hint-positional-argument
#    "BLE001", # Do not catch blind exception (often intentional for fallbacks)

    # TO Reenable these when we have a good reason to use them
    "C901", # complex-structure
    "FIX002", # line-contains-todo
    "PLR2004", # magic-value-comparison
    "PLR0912", # too-many-branches
    "PLR0914", # too-many-locals
]

[lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.params.Depends", "fastapi.Query", "fastapi.params.Query"]

[lint.pep8-naming]
classmethod-decorators = ["classmethod","validator", "field_validator", "root_validator"]

[lint.per-file-ignores]
"models/*.py" = ["PLC1901"]
"tests/**/*.py" = [
    "S101",     # Use of assert detected (standard in pytest)
    "PLR6301",  # Method could be a function (pytest test methods)
    "SLF001",   # Private member accessed (test setup)
    "PLC0415",  # Import at top-level (needed for mocking)
    "ARG005",   # Unused lambda argument (in mocking)
    "I001",     # Unused import (often imported for test setup)
    "F401",     # Unused import (often imported for test setup)
    "E402",     # Module level import not at top of file (alembic generated)
    "PT006",    # Use of f-string in logging function (alembic generated)
    "RUF001",   # Ambiguous unicode character (intentional Persian/Arabic strings)
]
"migrations/**/*.py" = [
    "INP001",   # Implicit namespace package (migrations don't need __init__.py)
    "ERA001",   # Commented-out code (often useful in migrations as examples)
    "PGH004",   # Use specific rule codes when using noqa (alembic generated)
    "E402",     # Module level import not at top of file (alembic generated)
    "E501",     # Line too long (alembic auto-generated code)
    "W291",     # Trailing whitespace (alembic generated)
    "F405",     # Name may be undefined, or defined from star imports (alembic generated)
    "RUF001",   # Ambiguous unicode character (intentional Persian/Arabic strings)
]

[lint.flake8-tidy-imports]
# Disallow all relative imports.
ban-relative-imports = "all"
